<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo-600
                        primaryHover: '#4338CA', // Indigo-700
                        background: '#F9FAFB', // Gray-50
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: theme('colors.background');
        }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .ticket-image-container {
            mask-image: radial-gradient(circle at 10px 50%, transparent 10px, black 11px);
            -webkit-mask-image: radial-gradient(circle at 10px 50%, transparent 10px, black 11px);
        }
    </style>
</head>
<body class="min-h-screen text-gray-800 flex flex-col items-center justify-center p-4 sm:p-8">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden border border-gray-100">
        
        <!-- Header -->
        <div class="bg-primary px-6 py-10 sm:px-10 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <svg class="absolute -top-10 -left-10 w-40 h-40 text-white fill-current" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg>
                <svg class="absolute top-20 right-[-20px] w-32 h-32 text-white fill-current" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg>
            </div>
            
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2 relative z-10" id="eventTitleDisplay">Welcome Party 2026</h1>
            <p class="text-indigo-100 text-lg relative z-10 mb-4" id="eventDateDisplay">October 24, 2026 • Main Hall</p>
            
            <!-- ป้ายแสดงยอดคนสมัครเรียลไทม์ -->
            <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-sm text-white px-4 py-2 rounded-full font-medium text-sm relative z-10 shadow-sm border border-white/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="applicantCountText">กำลังเชื่อมต่อฐานข้อมูล...</span>
            </div>
        </div>

        <!-- แถบแสดงสถานะเวลา -->
        <div id="eventStatusBanner" class="hidden bg-gray-100 text-gray-800 p-4 text-center border-b border-gray-200">
            <p id="eventStatusText" class="font-semibold text-lg"></p>
            <p id="eventCountdown" class="text-sm font-mono mt-1 text-gray-600"></p>
        </div>
        
        <!-- Form Section -->
        <div class="p-6 sm:px-10 sm:pb-10 pt-8">
            <form id="registrationForm" onsubmit="submitForm(event)" class="space-y-6">

                <div id="alertContainer" class="hidden p-4 rounded-md text-sm font-medium">
                    <p id="alertMessage"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">ชื่อจริง (First Name) *</label>
                        <input type="text" id="firstName" name="firstName" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                    
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">นามสกุล (Last Name) *</label>
                        <input type="text" id="lastName" name="lastName" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="studentId" class="block text-sm font-medium text-gray-700 mb-1">รหัสนิสิต/นักศึกษา *</label>
                        <input type="text" id="studentId" name="studentId" required placeholder="เช่น 66123456"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>

                    <div>
                        <label for="yearLevel" class="block text-sm font-medium text-gray-700 mb-1">ชั้นปี *</label>
                        <select id="yearLevel" name="yearLevel" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all bg-white appearance-none">
                            <option value="" disabled selected>เลือกชั้นปี...</option>
                            <option value="ปี 1">ปี 1</option>
                            <option value="ปี 2">ปี 2</option>
                            <option value="ปี 3">ปี 3</option>
                            <option value="ปี 4">ปี 4</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 mb-1">อีเมล (Email) *</label>
                        <input type="email" id="email" name="email" required
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>

                    <div>
                        <label for="phone" class="block text-sm font-medium text-gray-700 mb-1">เบอร์ติดต่อ (Phone)</label>
                        <input type="tel" id="phone" name="phone"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label for="dietary" class="block text-sm font-medium text-gray-700 mb-1">ข้อจำกัดเรื่องอาหาร (ถ้ามี)</label>
                    <input type="text" id="dietary" name="dietary" placeholder="เช่น มังสวิรัติ, แพ้อาหารทะเล, อิสลาม"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                </div>

                <div>
                    <label for="comments" class="block text-sm font-medium text-gray-700 mb-1">คำถามเพิ่มเติมหรือข้อเสนอแนะ</label>
                    <textarea id="comments" name="comments" rows="2"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all resize-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transition-all duration-200 flex items-center justify-center text-lg mt-4">
                    <div id="btnSpinner" class="loader hidden"></div>
                    <span id="btnText">ลงทะเบียน (Register)</span>
                </button>
            </form>
            
            <!-- Success State -->
            <div id="successState" class="hidden text-center py-10">
                <div class="w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                    <svg class="w-12 h-12 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 mb-3">ลงทะเบียนสำเร็จ!</h2>
                <p class="text-gray-600 mb-8 max-w-md mx-auto text-lg">ข้อมูลของคุณถูกบันทึกเรียบร้อยแล้ว โปรดเซฟรูปตั๋วด้านล่างนี้ไว้เพื่อใช้เข้างาน</p>
                
                <!-- ตั๋วดีไซน์กำหนดเอง -->
                <div class="inline-block mx-auto mb-8">
                    <div class="ticket-image-container relative rounded-xl overflow-hidden shadow-2xl border-4 border-gray-800 flex flex-col bg-gray-900 text-white w-64 sm:w-80 text-left">
                        
                        <!-- ⚠️ เปลี่ยนลิงก์รูปตั๋วของคุณเองตรงนี้ได้เลย ⚠️ -->
                        <img id="customTicketImage" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=600&auto=format&fit=crop" alt="Event Ticket" class="w-full h-48 object-cover opacity-80">
                        
                        <div class="p-6 border-t-2 border-dashed border-gray-600">
                            <h3 class="font-bold text-xl uppercase tracking-widest mb-1 text-primary">OFFICIAL TICKET</h3>
                            <p class="text-sm text-gray-400 mb-4" id="ticketEventName">Welcome Party 2026</p>
                            
                            <div class="bg-gray-800 p-3 rounded-lg mb-2">
                                <p class="text-xs text-gray-400 uppercase">Name</p>
                                <p id="ticketNameDisplay" class="font-bold text-lg truncate"></p>
                            </div>
                            <div class="flex gap-2">
                                <div class="bg-gray-800 p-3 rounded-lg flex-1">
                                    <p class="text-xs text-gray-400 uppercase">Year</p>
                                    <p id="ticketYearDisplay" class="font-bold text-md truncate"></p>
                                </div>
                                <div class="bg-gray-800 p-3 rounded-lg flex-1">
                                    <p class="text-xs text-gray-400 uppercase">Status</p>
                                    <p class="font-bold text-green-400 text-md">CONFIRMED</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <br>

                <button onclick="resetForm()" class="bg-white border-2 border-gray-200 hover:bg-gray-50 text-gray-800 font-semibold py-3 px-8 rounded-lg transition-colors shadow-sm">
                    ลงทะเบียนให้คนอื่นเพิ่ม
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * ⚠️ 1. นำ Web App URL อันใหม่ของคุณมาใส่ที่นี่ ⚠️
         * ==========================================
         */
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3WnV1pH8DTtslZvkDgfovRUXRSvzLXk3QIVBxMggbOz-bFYD5PQUQk2EameAxDs0l/exec"; 

        /**
         * ==========================================
         * ⚠️ 2. ตั้งชื่องานและเวลาเปิด-ปิดรับสมัคร ⚠️
         * ==========================================
         */
        const eventConfig = {
            title: "Welcome Party 2026",
            dateStr: "October 24, 2026 • Main Hall",
            
            // ตั้งเวลาเปิดรับสมัคร 
            openTime: new Date("2024-10-01T00:00:00").getTime(), 
            
            // ตั้งเวลาปิดรับสมัคร 
            closeTime: new Date("2026-10-31T23:59:00").getTime(), 
        };

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertContainer = document.getElementById('alertContainer');
        const alertMessage = document.getElementById('alertMessage');
        const successState = document.getElementById('successState');
        const countDisplay = document.getElementById('applicantCountText');
        
        let statusInterval;
        let submittedData = {};

        window.onload = function() {
            document.getElementById('eventTitleDisplay').innerText = eventConfig.title;
            document.getElementById('eventDateDisplay').innerText = eventConfig.dateStr;
            document.getElementById('ticketEventName').innerText = eventConfig.title;

            updateUIState();
            fetchApplicantCount();
            statusInterval = setInterval(updateUIState, 1000); 
        };

        // ดึงยอดผู้สมัครจาก Apps Script แบบเรียลไทม์
        function fetchApplicantCount() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === "") {
                countDisplay.innerText = "ยังไม่ได้ใส่ลิงก์ฐานข้อมูล";
                return;
            }
            
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => response.json())
                .then(data => {
                    if (data && data.count !== undefined) {
                        countDisplay.innerText = `มีผู้ลงทะเบียนแล้ว ${data.count} คน`;
                    } else {
                        countDisplay.innerText = "เปิดรับลงทะเบียนแล้ว";
                    }
                })
                .catch(error => {
                    console.error("Error fetching count:", error);
                    countDisplay.innerText = "กำลังเปิดรับสมัคร";
                });
        }

        function updateUIState() {
            const now = new Date().getTime();
            const banner = document.getElementById('eventStatusBanner');
            const statusText = document.getElementById('eventStatusText');
            const countdown = document.getElementById('eventCountdown');
            
            let isFormActive = true;

            if (now < eventConfig.openTime) {
                isFormActive = false;
                banner.classList.remove('hidden');
                banner.className = 'bg-blue-50 text-blue-800 p-4 text-center border-b border-blue-200';
                statusText.innerText = "ยังไม่เปิดรับสมัคร (Opens Soon)";
                countdown.innerText = `เปิดในอีก: ${formatTimeDiff(now, eventConfig.openTime)}`;
            } else if (now > eventConfig.closeTime) {
                isFormActive = false;
                banner.classList.remove('hidden');
                banner.className = 'bg-gray-100 text-gray-800 p-4 text-center border-b border-gray-200';
                statusText.innerText = "หมดเวลารับสมัครแล้ว (Closed)";
                countdown.innerText = "";
            } else {
                banner.classList.add('hidden');
            }

            Array.from(form.elements).forEach(element => {
                if(element.tagName !== 'FIELDSET') {
                    element.disabled = !isFormActive;
                }
            });
            
            if (!isFormActive) {
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                btnText.innerText = 'ฟอร์มปิดรับสมัคร';
            } else {
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                btnText.innerText = 'ลงทะเบียน (Register)';
            }
        }

        function formatTimeDiff(start, end) {
            const diff = end - start;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return `${days} วัน ${hours} ชม. ${minutes} นาที`;
        }

        // ระบบส่งฟอร์มฉบับแก้บัค: ส่งเป็นข้อความ JSON โดยตรง (เสถียรที่สุด)
        function submitForm(event) {
            event.preventDefault();

            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === "") {
                showAlert('Error: กรุณาใส่ Google Script URL ในโค้ด', 'error');
                return;
            }

            setLoadingState(true);
            hideAlert();

            // ดึงข้อมูลจากฟอร์มมาเก็บเป็น Object ของ JavaScript โดยตรง
            const dataObj = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                studentId: document.getElementById('studentId').value,
                yearLevel: document.getElementById('yearLevel').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                dietary: document.getElementById('dietary').value,
                comments: document.getElementById('comments').value
            };
            
            // เก็บไว้แสดงบนตั๋ว
            submittedData = {
                firstName: dataObj.firstName,
                lastName: dataObj.lastName,
                yearLevel: dataObj.yearLevel
            };

            // ส่งข้อมูลไป Apps Script โดยแปลงเป็นข้อความ JSON
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // บังคับให้เบราว์เซอร์ไม่บล็อก
                body: JSON.stringify(dataObj) // ส่งข้อมูลไปทั้งก้อนแบบข้อความ
            })
            .then(() => {
                // เนื่องจากใช้ no-cors โค้ดจะวิ่งมาตรงนี้เสมอถ้าไม่ติดปัญหาเน็ตหลุด
                handleFormSuccess();
            })
            .catch(error => {
                console.error('Submission Error:', error);
                setLoadingState(false);
                showAlert('การส่งข้อมูลล้มเหลว กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองอีกครั้ง', 'error');
            });
        }

        function handleFormSuccess() {
            setLoadingState(false);
            
            // อัปเดตข้อมูลบนตั๋ว
            document.getElementById('ticketNameDisplay').innerText = `${submittedData.firstName} ${submittedData.lastName}`;
            document.getElementById('ticketYearDisplay').innerText = submittedData.yearLevel;
            
            form.classList.add('hidden');
            document.getElementById('eventStatusBanner').classList.add('hidden');
            successState.classList.remove('hidden');

            setTimeout(fetchApplicantCount, 2000); 
        }

        function setLoadingState(isLoading) {
            if (isLoading) {
                btnText.innerText = 'กำลังส่งข้อมูล...';
                btnSpinner.classList.remove('hidden');
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed');
                submitBtn.disabled = true;
                Array.from(form.elements).forEach(element => element.disabled = true);
            } else {
                btnSpinner.classList.add('hidden');
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed');
                submitBtn.disabled = false;
                Array.from(form.elements).forEach(element => element.disabled = false);
                updateUIState(); 
            }
        }

        function showAlert(message, type) {
            alertMessage.innerText = message;
            alertContainer.classList.remove('hidden', 'bg-red-50', 'text-red-800', 'border', 'border-red-200');
            if (type === 'error') {
                alertContainer.classList.add('bg-red-50', 'text-red-800', 'border', 'border-red-200');
            }
        }

        function hideAlert() {
            alertContainer.classList.add('hidden');
        }

        function resetForm() {
            form.reset();
            form.classList.remove('hidden');
            successState.classList.add('hidden');
            hideAlert();
            updateUIState();
        }
    </script>
</body>
</html>
