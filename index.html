<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome SAN Party 2026</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti for Celebration Animation -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#4F46E5', // Indigo-600
                        primaryHover: '#4338CA', // Indigo-700
                    },
                    fontFamily: {
                        sans: ['Sarabun', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body {
            font-family: 'Sarabun', sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* เอฟเฟกต์โหลด */
        .loader {
            border: 3px solid rgba(255,255,255,0.3);
            border-top: 3px solid white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* รอยปะและรอยแหว่งของตั๋ว */
        .ticket-image-container {
            mask-image: radial-gradient(circle at 10px 50%, transparent 10px, black 11px);
            -webkit-mask-image: radial-gradient(circle at 10px 50%, transparent 10px, black 11px);
        }

        /* อนิเมชันเด้งตั๋ว */
        @keyframes popIn {
            0% { transform: scale(0.5) translateY(50px); opacity: 0; }
            70% { transform: scale(1.05) translateY(-10px); opacity: 1; }
            100% { transform: scale(1) translateY(0); opacity: 1; }
        }
        .animate-pop-in {
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* เอฟเฟกต์แสงเงาวิบวับบนตั๋ว */
        .ticket-shine {
            position: relative;
            overflow: hidden;
        }
        .ticket-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -150%;
            width: 50%;
            height: 100%;
            background: linear-gradient(to right, rgba(255,255,255,0) 0%, rgba(255,255,255,0.3) 50%, rgba(255,255,255,0) 100%);
            transform: skewX(-25deg);
            animation: shine 4s infinite;
        }
        @keyframes shine {
            0% { left: -150%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }
    </style>
</head>
<body class="min-h-screen bg-gray-50 dark:bg-gray-900 text-gray-800 dark:text-gray-100 flex flex-col items-center justify-center p-4 sm:p-8">

    <!-- ปุ่มสลับธีม -->
    <button onclick="toggleTheme()" aria-label="สลับธีม สว่าง/มืด" class="fixed top-4 right-4 z-50 p-3 rounded-full bg-white dark:bg-gray-800 shadow-lg text-gray-600 dark:text-gray-300 hover:scale-110 transition-transform border border-gray-200 dark:border-gray-700">
        <svg id="sun-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
        <svg id="moon-icon" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
    </button>

    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-xl w-full max-w-3xl overflow-hidden border border-gray-100 dark:border-gray-700 transition-colors duration-300">
        
        <!-- Header -->
        <div class="bg-primary px-6 py-10 sm:px-10 text-center relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none">
                <svg class="absolute -top-10 -left-10 w-40 h-40 text-white fill-current animate-pulse" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg>
                <svg class="absolute top-20 right-[-20px] w-32 h-32 text-white fill-current" viewBox="0 0 100 100"><circle cx="50" cy="50" r="50"/></svg>
            </div>
            
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2 relative z-10" id="eventTitleDisplay">Welcome SAN Party 2026</h1>
            <p class="text-indigo-100 text-lg relative z-10 mb-4" id="eventDateDisplay">20 ธันวาคม 2026 • Main Hall</p>
            
            <!-- ป้ายแสดงยอดคนสมัคร -->
            <div class="inline-flex items-center gap-2 bg-white/20 backdrop-blur-sm text-white px-4 py-2 rounded-full font-medium text-sm relative z-10 shadow-sm border border-white/30 hover:bg-white/30 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                <span id="applicantCountText">กำลังเชื่อมต่อฐานข้อมูล...</span>
            </div>
        </div>

        <!-- แถบแสดงสถานะเวลา -->
        <div id="eventStatusBanner" class="hidden bg-gray-100 dark:bg-gray-700 text-gray-800 dark:text-gray-100 p-4 text-center border-b border-gray-200 dark:border-gray-600 transition-colors">
            <p id="eventStatusText" class="font-semibold text-lg"></p>
            <p id="eventCountdown" class="text-sm font-mono mt-1 text-gray-600 dark:text-gray-400"></p>
        </div>
        
        <!-- Form Section -->
        <div class="p-6 sm:px-10 sm:pb-10 pt-8">
            <form id="registrationForm" onsubmit="submitForm(event)" class="space-y-6">

                <!-- กล่องข้อความแจ้งเตือน (แสดงกรณีเกิดข้อผิดพลาด / ข้อมูลซ้ำ) -->
                <div id="alertContainer" class="hidden p-4 rounded-lg text-sm font-medium flex items-start gap-3">
                    <svg class="w-5 h-5 flex-shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                    <p id="alertMessage" class="flex-1"></p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="firstName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ชื่อจริง (First Name) *</label>
                        <input type="text" id="firstName" name="firstName" required
                            class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                    
                    <div>
                        <label for="lastName" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">นามสกุล (Last Name) *</label>
                        <input type="text" id="lastName" name="lastName" required
                            class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="studentId" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">รหัสนักศึกษา (Student ID) *</label>
                        <input type="text" id="studentId" name="studentId" required placeholder="เช่น 66123456" pattern="[0-9]{8,13}" title="กรุณากรอกรหัสนักศึกษาเป็นตัวเลข 8-13 หลัก"
                            class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>

                    <div>
                        <label for="yearLevel" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ชั้นปี *</label>
                        <select id="yearLevel" name="yearLevel" required
                            class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                            <option value="" disabled selected>เลือกชั้นปี...</option>
                            <option value="ปี 1">ปี 1</option>
                            <option value="ปี 2">ปี 2</option>
                            <option value="ปี 3">ปี 3</option>
                            <option value="ปี 4">ปี 4</option>
                            <option value="อื่นๆ">อื่นๆ</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label for="nickname" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ชื่อเล่น (Nickname) *</label>
                        <input type="text" id="nickname" name="nickname" required
                            class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>

                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">อีเมล (Email) *</label>
                        <input type="email" id="email" name="email" required placeholder="@student.mahidol.ac.th or .edu"
                            class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                    </div>
                </div>

                <div>
                    <label for="dietary" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">ข้อจำกัดเรื่องอาหาร (ถ้ามี)</label>
                    <input type="text" id="dietary" name="dietary" placeholder="เช่น มังสวิรัติ, แพ้อาหารทะเล, อิสลาม"
                        class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all">
                </div>

                <div>
                    <label for="comments" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">คำถามเพิ่มเติมหรือข้อเสนอแนะ</label>
                    <textarea id="comments" name="comments" rows="2"
                        class="w-full px-4 py-3 bg-white dark:bg-gray-700 border border-gray-300 dark:border-gray-600 rounded-lg text-gray-800 dark:text-gray-100 focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all resize-none"></textarea>
                </div>

                <button type="submit" id="submitBtn" 
                    class="w-full bg-primary hover:bg-primaryHover text-white font-bold py-4 px-6 rounded-lg shadow-md hover:shadow-lg transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center text-lg mt-4">
                    <div id="btnSpinner" class="loader hidden"></div>
                    <span id="btnText">ลงทะเบียนเข้าร่วมงาน</span>
                </button>
            </form>
            
            <!-- Success State -->
            <div id="successState" class="hidden text-center py-10">
                <div class="w-24 h-24 bg-green-100 dark:bg-green-900/50 rounded-full flex items-center justify-center mx-auto mb-6 transform scale-0" id="successIcon">
                    <svg class="w-12 h-12 text-green-500 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold text-gray-800 dark:text-white mb-3">ลงทะเบียนสำเร็จเรียบร้อย!</h2>
                <p class="text-gray-600 dark:text-gray-300 mb-8 max-w-md mx-auto text-lg">ข้อมูลของคุณถูกบันทึกลงในระบบเรียบร้อยแล้ว โปรดบันทึกภาพหน้าจอหรือเก็บ E-Ticket ด้านล่างไว้สำหรับแสดงหน้างาน</p>
                
                <!-- ตั๋ว E-Ticket -->
                <div class="inline-block mx-auto mb-8 perspective-1000" id="ticketBlock">
                    <div class="ticket-image-container ticket-shine relative rounded-xl overflow-hidden shadow-2xl border-4 border-gray-800 dark:border-gray-600 flex flex-col bg-gray-900 text-white w-64 sm:w-80 text-left transform transition-transform duration-500 hover:rotate-1 hover:scale-105">
                        
                        <img id="customTicketImage" src="https://images.unsplash.com/photo-1514525253161-7a46d19cd819?q=80&w=600&auto=format&fit=crop" alt="Event Ticket" class="w-full h-48 object-cover opacity-80 mix-blend-overlay">
                        <div class="absolute inset-0 bg-gradient-to-t from-gray-900 to-transparent opacity-80"></div>
                        
                        <div class="p-6 border-t-2 border-dashed border-gray-600 relative z-10">
                            <h3 class="font-bold text-xl uppercase tracking-widest mb-1 text-primary">OFFICIAL TICKET</h3>
                            <p class="text-sm text-gray-400 mb-4" id="ticketEventName">Welcome SAN Party 2026</p>
                            
                            <div class="bg-gray-800/80 backdrop-blur-sm p-3 rounded-lg mb-2 border border-gray-700">
                                <p class="text-xs text-gray-400 uppercase">ชื่อ - นามสกุล</p>
                                <p id="ticketNameDisplay" class="font-bold text-lg truncate"></p>
                            </div>
                            <div class="flex gap-2">
                                <div class="bg-gray-800/80 backdrop-blur-sm p-3 rounded-lg flex-1 border border-gray-700">
                                    <p class="text-xs text-gray-400 uppercase">ชั้นปี</p>
                                    <p id="ticketYearDisplay" class="font-bold text-md truncate"></p>
                                </div>
                                <div class="bg-gray-800/80 backdrop-blur-sm p-3 rounded-lg flex-1 border border-gray-700">
                                    <p class="text-xs text-gray-400 uppercase">สถานะ</p>
                                    <p class="font-bold text-green-400 text-md">CONFIRMED</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <br>

                <button onclick="resetForm()" class="bg-white dark:bg-gray-700 border-2 border-gray-200 dark:border-gray-600 hover:bg-gray-50 dark:hover:bg-gray-600 text-gray-800 dark:text-gray-200 font-semibold py-3 px-8 rounded-lg transition-colors shadow-sm">
                    ลงทะเบียนบุคคลอื่นเพิ่ม
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * ⚠️ 1. นำ Web App URL ที่ได้จาก New Deployment มาใส่ที่นี่ ⚠️
         * ==========================================
         */
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx3WnV1pH8DTtslZvkDgfovRUXRSvzLXk3QIVBxMggbOz-bFYD5PQUQk2EameAxDs0l/exec"; 

        /**
         * ==========================================
         * ⚠️ 2. ตั้งชื่องานและเวลาเปิด-ปิดรับสมัคร ⚠️
         * ==========================================
         */
        const eventConfig = {
            title: "Welcome SAN Party 2026",
            dateStr: "20 ธันวาคม 2026 • Main Hall",
            openTime: new Date("2024-10-01T00:00:00").getTime(), 
            closeTime: new Date("2026-12-19T23:59:00").getTime(), 
        };

        const form = document.getElementById('registrationForm');
        const submitBtn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnSpinner = document.getElementById('btnSpinner');
        const alertContainer = document.getElementById('alertContainer');
        const alertMessage = document.getElementById('alertMessage');
        const successState = document.getElementById('successState');
        const countDisplay = document.getElementById('applicantCountText');
        
        let statusInterval;
        let submittedData = {};
        let isSubmitting = false; // ป้องกันการกดส่งซ้ำและไม่ให้ interval รีเซ็ตปุ่ม

        // ระบบ Dark Mode
        const html = document.documentElement;
        const sunIcon = document.getElementById('sun-icon');
        const moonIcon = document.getElementById('moon-icon');

        function initTheme() {
            if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                html.classList.add('dark');
                sunIcon.classList.remove('hidden');
            } else {
                html.classList.remove('dark');
                moonIcon.classList.remove('hidden');
            }
        }

        function toggleTheme() {
            html.classList.toggle('dark');
            const isDark = html.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            
            if (isDark) {
                sunIcon.classList.remove('hidden');
                moonIcon.classList.add('hidden');
            } else {
                sunIcon.classList.add('hidden');
                moonIcon.classList.remove('hidden');
            }
        }

        window.onload = function() {
            initTheme();
            document.getElementById('eventTitleDisplay').innerText = eventConfig.title;
            document.getElementById('eventDateDisplay').innerText = eventConfig.dateStr;
            document.getElementById('ticketEventName').innerText = eventConfig.title;

            updateUIState();
            fetchApplicantCount();
            statusInterval = setInterval(updateUIState, 1000); 
        };

        function fetchApplicantCount() {
            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === "") return;
            fetch(GOOGLE_SCRIPT_URL)
                .then(response => {
                    if (!response.ok) throw new Error('ไม่สามารถเชื่อมต่อได้');
                    return response.json();
                })
                .then(data => {
                    if (data && data.count !== undefined) {
                        countDisplay.innerText = `มีผู้ลงทะเบียนแล้ว ${data.count} คน`;
                    }
                })
                .catch(() => {
                    countDisplay.innerText = 'ยินดีต้อนรับผู้เข้าร่วมงานทุกคน';
                });
        }

        function updateUIState() {
            if (isSubmitting) return; // หากกำลังส่งข้อมูล ห้ามแก้ไขสถานะปุ่ม
            
            const now = new Date().getTime();
            const banner = document.getElementById('eventStatusBanner');
            const statusText = document.getElementById('eventStatusText');
            const countdown = document.getElementById('eventCountdown');
            
            let isFormActive = true;

            if (now < eventConfig.openTime) {
                isFormActive = false;
                banner.classList.remove('hidden');
                banner.className = 'bg-blue-50 dark:bg-blue-900/30 text-blue-800 dark:text-blue-300 p-4 text-center border-b border-blue-200 dark:border-blue-800';
                statusText.innerText = "ยังไม่เปิดรับสมัคร (Opens Soon)";
                countdown.innerText = `เปิดรับสมัครในอีก: ${formatTimeDiff(now, eventConfig.openTime)}`;
            } else if (now > eventConfig.closeTime) {
                isFormActive = false;
                banner.classList.remove('hidden');
                banner.className = 'bg-gray-100 dark:bg-gray-800 text-gray-800 dark:text-gray-300 p-4 text-center border-b border-gray-200 dark:border-gray-700';
                statusText.innerText = "ปิดรับสมัครเรียบร้อยแล้ว (Registration Closed)";
                countdown.innerText = "";
            } else {
                banner.classList.add('hidden');
            }

            Array.from(form.elements).forEach(element => {
                if(element.tagName !== 'FIELDSET') element.disabled = !isFormActive;
            });
            
            if (!isFormActive) {
                submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
                btnText.innerText = 'ปิดรับสมัครแล้ว';
            } else {
                submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                btnText.innerText = 'ลงทะเบียนเข้าร่วมงาน';
            }
        }

        function formatTimeDiff(start, end) {
            const diff = end - start;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);
            return `${days} วัน ${hours} ชั่วโมง ${minutes} นาที ${seconds} วินาที`;
        }

        /**
         * ส่งข้อมูลและ "รอรับผลยืนยันจริง" จาก Apps Script
         */
        async function submitForm(event) {
            event.preventDefault();
            
            if (isSubmitting) return;

            if (!GOOGLE_SCRIPT_URL || GOOGLE_SCRIPT_URL.trim() === "") {
                showAlert('กรุณาตั้งค่า GOOGLE_SCRIPT_URL ในโค้ดก่อนเริ่มใช้งาน', 'error');
                return;
            }

            setLoadingState(true);
            hideAlert();

            const dataObj = {
                firstName: document.getElementById('firstName').value.trim(),
                lastName: document.getElementById('lastName').value.trim(),
                studentId: document.getElementById('studentId').value.trim(),
                yearLevel: document.getElementById('yearLevel').value,
                nickname: document.getElementById('nickname').value.trim(),
                email: document.getElementById('email').value.trim(),
                dietary: document.getElementById('dietary').value.trim(),
                comments: document.getElementById('comments').value.trim()
            };
            
            submittedData = {
                firstName: dataObj.firstName,
                lastName: dataObj.lastName,
                yearLevel: dataObj.yearLevel
            };

            try {
                // ส่งเป็นข้อความ JSON โดยไม่ใส่ Header พิเศษเพื่อเลี่ยง CORS Preflight (OPTIONS)
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    body: JSON.stringify(dataObj)
                });

                const result = await response.json();

                if (result.result === 'success') {
                    // ยืนยันผลสำเร็จจริงจาก Backend ก่อนแสดงตั๋ว
                    handleFormSuccess();
                } else {
                    // Backend ปฏิเสธ เช่น ข้อมูลซ้ำ หรือปิดรับสมัครแล้ว
                    setLoadingState(false);
                    showAlert(result.message || 'เกิดข้อผิดพลาดในการลงทะเบียน', 'error');
                }
            } catch (error) {
                setLoadingState(false);
                showAlert('ไม่สามารถติดต่อเซิร์ฟเวอร์ได้ กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง (' + error.message + ')', 'error');
            }
        }

        function handleFormSuccess() {
            setLoadingState(false);
            
            document.getElementById('ticketNameDisplay').innerText = `${submittedData.firstName} ${submittedData.lastName}`;
            document.getElementById('ticketYearDisplay').innerText = submittedData.yearLevel;
            
            form.classList.add('hidden');
            document.getElementById('eventStatusBanner').classList.add('hidden');
            successState.classList.remove('hidden');

            // 1. อนิเมชันไอคอนติ๊กถูก
            document.getElementById('successIcon').classList.add('transition-transform', 'duration-500', 'scale-100');
            
            // 2. อนิเมชันตั๋วเด้ง (Pop In)
            const ticket = document.getElementById('ticketBlock');
            ticket.classList.remove('animate-pop-in');
            void ticket.offsetWidth;
            ticket.classList.add('animate-pop-in');

            // 3. ยิงพลุกระดาษฉลอง
            triggerConfetti();

            setTimeout(fetchApplicantCount, 1500); 
        }

        function triggerConfetti() {
            const duration = 3 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 100 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            const interval = setInterval(function() {
              const timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);

              const particleCount = 50 * (timeLeft / duration);
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } }));
              confetti(Object.assign({}, defaults, { particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } }));
            }, 250);
        }

        function setLoadingState(isLoading) {
            isSubmitting = isLoading;
            if (isLoading) {
                btnText.innerText = 'กำลังตรวจสอบและบันทึกข้อมูล...';
                btnSpinner.classList.remove('hidden');
                submitBtn.classList.add('opacity-75', 'cursor-not-allowed', 'scale-95');
                submitBtn.disabled = true;
                Array.from(form.elements).forEach(element => element.disabled = true);
            } else {
                btnSpinner.classList.add('hidden');
                submitBtn.classList.remove('opacity-75', 'cursor-not-allowed', 'scale-95');
                submitBtn.disabled = false;
                Array.from(form.elements).forEach(element => element.disabled = false);
                updateUIState(); 
            }
        }

        function showAlert(message, type) {
            alertMessage.innerText = message;
            alertContainer.classList.remove('hidden');
            if (type === 'error') {
                alertContainer.className = 'p-4 rounded-lg text-sm font-medium bg-red-50 dark:bg-red-900/30 text-red-800 dark:text-red-300 border border-red-200 dark:border-red-800 flex items-start gap-3';
            }
        }

        function hideAlert() {
            alertContainer.classList.add('hidden');
        }

        function resetForm() {
            form.reset();
            form.classList.remove('hidden');
            successState.classList.add('hidden');
            document.getElementById('successIcon').classList.replace('scale-100', 'scale-0');
            hideAlert();
            updateUIState();
        }
    </script>
</body>
</html>
